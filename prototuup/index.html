:root{--blue:#006CE6;--blue-d:#004FA8;--navy:#002F63;--text:#293036;--muted:#6B7074;--bg:#F5F7F9;--light:#EDF7FD;--light-b:#D3E8F5;--border:#D6DEE6;--line:#E0E6EC;--input:#8A929B;--green:#008300;--red:#DB2200;--warn:#A15C00}
*{box-sizing:border-box}
html,body{margin:0;background:#E9EDF1;color:var(--text);font-family:Roboto,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.45}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1[tabindex="-1"]:focus,h1[tabindex="-1"]:focus-visible{outline:none}
h1,h2,h3{margin:0}
.serif{font-family:Merriweather,Georgia,serif}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* esitleja riba */
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#1D2329;color:#E9EDF1;font-size:13px}
#bar select{font:inherit;padding:4px 6px;border-radius:2px;border:1px solid #5A636B;background:#2A3138;color:#fff}
#bar button{font:inherit;padding:4px 10px;border-radius:2px;border:1px solid #5A636B;background:#2A3138;color:#fff;cursor:pointer}
#bar .hint{color:#AEB6BE}
body.peidetud #bar{display:none}
#stage{padding:24px 16px 48px;display:flex;justify-content:center}
/* telefon */
.phone{width:390px;max-width:100%;min-height:844px;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 24px rgba(0,47,99,.12);border-radius:2px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}
.logo{display:flex;align-items:baseline;gap:6px}
.logo b{font-family:Merriweather,Georgia,serif;font-weight:900;font-size:20px;color:var(--navy)}
.logo span{font-size:15px;font-weight:500;color:var(--blue)}
.tag{font-size:11px;font-weight:500;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:2px;padding:3px 6px;white-space:nowrap}
.main{flex-grow:1;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;font-weight:500;color:var(--blue);letter-spacing:.02em;text-transform:uppercase}
.h1{font-family:Merriweather,Georgia,serif;font-size:24px;line-height:1.3;color:var(--navy)}
.h2{font-size:17px;font-weight:700;color:var(--navy)}
.lead{margin:0;font-size:15px;line-height:1.5}
.small{font-size:13px;line-height:1.45;color:var(--muted)}
.xs{font-size:12px;line-height:1.4;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:6px}
.stack8{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.row .k{color:var(--muted)}
.box{border:1px solid var(--border);border-radius:2px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.hl{background:var(--light);border:2px solid var(--blue);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px}
.info{background:var(--light);border:1px solid var(--light-b);border-radius:2px;padding:12px 14px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.warn{border:1px solid var(--warn);background:#FFF8EC;border-radius:2px;padding:10px 12px;font-size:13px;line-height:1.45;color:#5C3500}
.green{color:var(--green);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;background:var(--blue);color:#fff;border:2px solid var(--blue);border-radius:2px;font:inherit;font-weight:500;font-size:16px;text-decoration:none;cursor:pointer;width:100%}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.btn2{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:2px;font:inherit;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;width:100%}
.btn2.dash{border-style:dashed}
.btn3{display:flex;align-items:center;justify-content:center;min-height:44px;font-weight:500;font-size:15px;text-decoration:none;background:none;border:0;color:var(--blue);cursor:pointer;font-family:inherit;width:100%}
.btn[disabled]{background:#E0E6EC;border-color:#E0E6EC;color:#5A6068;cursor:not-allowed}
.back{font-size:14px;font-weight:500;text-decoration:none;min-height:44px;display:flex;align-items:center;align-self:flex-start;background:none;border:0;color:var(--blue);cursor:pointer;font-family:inherit;padding:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field input,.field select{height:44px;border:1px solid var(--input);border-radius:2px;padding:0 12px;color:var(--text);font:inherit;background:#fff;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;margin:0;padding:0}
.seg legend{font-size:14px;font-weight:500;padding:0;margin-bottom:8px}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border:2px solid var(--blue);border-radius:2px;color:var(--blue);font-weight:500;font-size:15px;cursor:pointer;background:#fff;text-align:center;padding:0 8px}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--blue);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--navy);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex-shrink:0}
.steps{margin:0;padding:4px 14px;list-style:none;border:1px solid var(--border);border-radius:2px}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:6px;margin-top:5px;flex-shrink:0;background:#fff;border:2px solid #6B8FB0}
.dot.ok{background:var(--green);border-color:var(--green)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-direction:column;gap:4px}
.track{height:14px;background:var(--bg);border-radius:2px}
.fill{height:14px;border-radius:2px;background:#8A929B}
.fill.meie{background:var(--green)}
.doc{border:1px solid var(--border);border-radius:2px;background:#FAFBFC;padding:16px;display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:1.55}
.doc h3{font-size:13px;font-weight:700;color:var(--navy)}
.doc p{margin:0}
.signed{border-top:1px solid var(--border);padding-top:10px}
.lisa{border:1px solid var(--border);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
/* Tuleva vaade */
.page{width:100%;max-width:1280px;background:var(--bg);min-height:900px;box-shadow:0 2px 24px rgba(0,47,99,.10)}
.page .hdr{padding:14px 32px;flex-wrap:wrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:2px;text-decoration:none;font-weight:500;font-size:15px;min-height:44px;display:flex;align-items:center}
.nav a[aria-current=page]{background:var(--light);color:var(--navy)}
.pmain{max-width:1200px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:24px}
.ptitle{font-family:Merriweather,Georgia,serif;font-size:30px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:14px}
.kpi{padding:18px;gap:6px}
.kpi .v{font-family:Merriweather,Georgia,serif;font-weight:900;font-size:30px;color:var(--navy)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.cols>.wide{flex:999 1 560px;min-width:0}
.cols>.narrow{flex:1 1 340px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:Merriweather,Georgia,serif;font-size:20px;color:var(--navy)}
.hbar{display:grid;grid-template-columns:200px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:16px}.hbar .fill{height:16px;background:#6B7074}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:10px 14px;font-weight:500;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);background:#FAFBFC}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
.num{text-align:right}
.navycard{background:var(--navy);color:#fff;border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:8px}
.navycard .s{font-size:14px;color:#D3E8F5;line-height:1.5}
.vbars{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));gap:8px;align-items:end;min-width:600px}
.vbars div{display:flex;flex-direction:column;align-items:center;gap:4px}
.badge{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:#fff;background:var(--green);border-radius:2px;padding:2px 6px}
@media (max-width:420px){#stage{padding:0}.phone{box-shadow:none}}
@media print{#bar{display:none}}
</style>
</head>
<body>
<div id="bar" role="navigation" aria-label="Esitleja">
  <strong>Tuleva Kogum · prototüüp</strong>
  <label for="hupe" class="sr-only">Ekraan</label>
  <select id="hupe"></select>
  <button type="button" id="eel" aria-label="Eelmine ekraan">←</button>
  <button type="button" id="jar" aria-label="Järgmine ekraan">→</button>
  <button type="button" id="algus">Algusesse</button>
  <span class="hint">Nooleklahvid ← → liiguvad kõne teel · H peidab riba</span>
</div>
<div id="stage"></div>
<div id="teade" class="sr-only" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- andmed (näidis) ---------- */
var TAVA = { Elisa: 43.99, Telia: 41.65, Tele2: 34.99 }; // tavahinnad, operaatorite lehed 10.10.2026
var TAVA_KESK = (TAVA.Elisa + TAVA.Telia + TAVA.Tele2) / 3;
var TASU = 0.5; // Tuleva tasu operaatorilt, näidis
var LEPINGUID = 560;

var S = algseis();
function algseis() {
  return {
    tyyp: 'era', nimi: 'Mari Näidis', isikukood: '4XXXXXXXXXX', firma: 'Näidis OÜ', regkood: '1XXXXXXX',
    esindaja: 'Jaan Näidis', esIsikukood: '3XXXXXXXXXX', alus: 'juhatus', tel: '+372 5XXX XXXX', epost: 'mari@naidis.ee',
    lisad: ['+372 5XXX XXXX'], nous: false, allkiri: false, lopp: '03 / 2027',
    pakk: { 'Operaator A': 6.50, 'Operaator B': 7.20, 'Operaator C': 6.90 }, uOp: 'Operaator A', teade: '', viga: false,
    siht: 6.5
  };
}
function voitja() { var b = null; for (var o in S.pakk) if (b === null || S.pakk[o] < S.pakk[b]) b = o; return b; }
function hind() { return S.pakk[voitja()]; }
function eur(x) { return x.toFixed(2).replace('.', ',') + ' €'; }
function tuh(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function saastAastas(h) { return (TAVA_KESK - h) * 12; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------- ekraanid ---------- */
var EKRAANID = [
  ['main', '1 · Registreerumine', 'tel'], ['k1', '2 · Minu Kogum: ootan pakkumist', 'tel'], ['m2', '3 · Pakkumine', 'tel'],
  ['m2b', '3b · Tähtajaline leping', 'tel'], ['m6', '3c · Mitte praegu', 'tel'], ['m3', '4 · Lepingu andmed', 'tel'],
  ['m3c', '4c · Leping ja allkiri', 'tel'], ['m4', '5 · Leping on saadetud', 'tel'], ['k1b', '6 · Minu Kogum aasta hiljem', 'tel'],
  ['m2c', '6b · Ühishange 2027', 'tel'], ['t1', '8 · Tuleva: osalejad', 'leht'], ['t2', '9 · Tuleva: hankepäring', 'leht'],
  ['t3', '10 · Tuleva: pakkumised', 'leht'], ['t4', '11 · Tuleva: aasta', 'leht']
];
var KONE = ['main', 'k1', 'm2', 'm3', 'm3c', 'm4', 't1', 't4'];

function tel(inner) {
  return '<div class="phone"><header class="hdr"><div class="logo"><b>Tuleva</b><span>Kogum</span></div><span class="tag">Prototüüp · näidisandmed</span></header><main class="main">' + inner + '</main></div>';
}
function leht(id, inner) {
  var nav = [['t1', 'Osalejad'], ['t2', 'Hange'], ['t3', 'Pakkumised'], ['t4', 'Aasta']].map(function (n) {
    return '<a href="#' + n[0] + '"' + (n[0] === id ? ' aria-current="page"' : '') + '>' + n[1] + '</a>';
  }).join('');
  return '<div class="page"><header class="hdr"><div class="logo"><b>Tuleva</b><span>Kogum · haldus</span></div><nav class="nav" aria-label="Haldus">' + nav + '</nav><span class="tag">Prototüüp · näidisandmed</span></header><main class="pmain">' + inner + '</main></div>';
}
function pealkiri(eyebrow, tekst, cls) {
  return '<div class="stack">' + (eyebrow ? '<span class="eyebrow">' + eyebrow + '</span>' : '') + '<h1 class="' + (cls || 'h1') + '" tabindex="-1">' + tekst + '</h1></div>';
}

var R = {};
R.main = function () {
  return tel(
    pealkiri('Mobiilside ühishange 2026', 'Kas soovid koos teistega soodsamat mobiilipaketti?') +
    '<p class="lead">Koos on meil läbirääkimisjõud, mida üksi pole. Tuleva küsib kõigilt operaatoritelt ühe hinna piiramatule mobiilipaketile: sama kõigile ja ilma sidumiseta.</p>' +
    '<p class="lead" style="font-size:14px">Osalemine ei kohusta vahetama ega maksa sulle midagi. Osaleda saavad kõik, ka ettevõtted.</p>' +
    '<div class="field"><label for="epost">E-post</label><input id="epost" type="email" autocomplete="email" data-bind="epost" value="' + esc(S.epost) + '" aria-describedby="epost-abi"><span id="epost-abi" class="small">Ainult pakkumise ja meeldetuletuste jaoks.</span></div>' +
    '<div style="padding-top:4px"><a class="btn" href="#k1">Jah, soovin osaleda</a></div>'
  );
};
R.k1 = function () {
  var s = [['Registreerusid', '10. oktoober 2026', 1], ['Tuleva küsib operaatoritelt pakkumised', 'november 2026', 0], ['Saad ühishanke pakkumise', 'e-postiga ja siin kontol', 0], ['Otsustad ise, kas vahetad', 'ühtegi kohustust pole', 0]];
  return tel(
    pealkiri('Minu Kogum', 'Oled ühishankes kirjas') +
    '<ol class="steps">' + s.map(function (x) { return '<li><span class="dot' + (x[2] ? ' ok' : '') + '" aria-hidden="true"></span><div class="stack" style="gap:2px"><span style="font-weight:500"><span class="sr-only">' + (x[2] ? 'Tehtud: ' : 'Ootel: ') + '</span>' + x[0] + '</span><span class="small">' + x[1] + '</span></div></li>'; }).join('') + '</ol>' +
    '<p class="lead" style="font-size:14px">Anname e-postiga märku, kui pakkumine on käes. Siis otsustad ise, kas võtad selle.</p>' +
    '<div style="padding-top:4px"><a class="btn2 dash" href="#m2">Demo: pakkumine on käes →</a></div>'
  );
};
function hinnaRibad() {
  var h = hind();
  var r = [['Elisa tavahind', TAVA.Elisa, 0], ['Telia tavahind', TAVA.Telia, 0], ['Tele2 tavahind', TAVA.Tele2, 0], ['Tuleva ühishange', h, 1]];
  var kirj = 'Piiramatu pakett kuus, tavahinnad 10.10.2026: ' + r.map(function (x) { return x[0] + ' ' + eur(x[1]); }).join(', ') + '.';
  return '<div class="bars" role="img" aria-label="' + esc(kirj) + '"><span class="small">Piiramatu pakett kuus · operaatorite lehtedelt 10.10.2026</span>' +
    r.map(function (x) {
      return '<div class="bar" aria-hidden="true"><div class="row"><span' + (x[2] ? ' class="green"' : '') + '>' + x[0] + '</span><span style="font-weight:700' + (x[2] ? ';color:var(--green)' : '') + '">' + eur(x[1]) + '</span></div><div class="track"><div class="fill' + (x[2] ? ' meie' : '') + '" style="width:' + Math.round(x[1] / TAVA.Elisa * 100) + '%"></div></div></div>';
    }).join('') + '</div>';
}
R.m2 = function () {
  var h = hind();
  return tel(
    '<a class="back" href="#k1">← Minu Kogum</a>' +
    pealkiri('Ühishanke 2026 tulemus', 'Piiramatu mobiilipakett') +
    '<div class="hl"><div class="row"><span style="font-size:15px;font-weight:500">' + voitja() + ' (näidis)</span><span><span class="serif" style="font-weight:900;font-size:34px;color:var(--navy)">' + eur(h) + '</span><span style="font-size:15px"> kuus</span></span></div>' +
    '<div class="stack" style="gap:4px;font-size:14px"><span>Piiramatu internet Eestis · ilma sidumiseta</span><span>Sama hind kõigile osalejatele</span><span style="font-weight:700;color:var(--navy)">Kui grupp kasvab, võib hind langeda.</span></div></div>' +
    '<section class="stack8" aria-labelledby="saast-h"><h2 id="saast-h" class="h2">Kui palju võid säästa</h2>' + hinnaRibad() +
    '<div class="row" style="border-top:1px solid var(--line);padding-top:10px"><span style="font-size:15px;font-weight:500">Sääst tavahinnaga võrreldes <span class="xs">(hinnang)</span></span><strong style="font-size:20px;color:var(--green);white-space:nowrap">kuni ≈ ' + tuh(saastAastas(h)) + ' € aastas</strong></div>' +
    '<span class="small">Kui maksad praegu vähem kui tavahinda, säästad vähem.</span></section>' +
    '<div class="stack8"><a class="btn" href="#m3">Võtan pakkumise</a><a class="btn3" href="#m2b">Mul on tähtajaline leping</a><a class="btn2" href="#m6">Mitte praegu</a>' +
    '<span class="xs" style="text-align:center">Sina Tulevale ei maksa. Operaator maksab Tulevale iga lepingu eest ' + eur(TASU) + ' kuus (näidis). Summa on kõigil operaatoritel sama.</span></div>'
  );
};
R.m2b = function () {
  return tel(
    '<a class="back" href="#m2">← Tagasi pakkumise juurde</a>' + pealkiri('', 'Sul on tähtajaline leping') +
    '<div class="info"><strong style="color:var(--navy)">Pakkumine ootab sind</strong><span>Piiramatu pakett ' + eur(hind()) + ' kuus kehtib oktoobrini 2027. Saad selle võtta, kui sinu praegune leping lõpeb.</span><span>Ennetähtaegne lõpetamine võib maksta. Vaata oma lepingust, enne kui otsustad.</span></div>' +
    '<div class="field"><label for="lopp">Millal sinu leping lõpeb?</label><input id="lopp" data-bind="lopp" value="' + esc(S.lopp) + '" aria-describedby="lopp-abi"><span id="lopp-abi" class="small">Kui ei tea, leiad selle operaatori iseteenindusest lepingute alt.</span></div>' +
    '<div style="padding-top:4px"><a class="btn" href="#m6">Tuleta mulle kuu enne meelde</a></div>'
  );
};
R.m6 = function () {
  return tel(
    pealkiri('', 'Hoiame pakkumise sinu jaoks alles') +
    '<p class="lead">Sa ei pea praegu midagi otsustama. Pakkumine kehtib oktoobrini 2027.</p>' +
    '<div class="box"><div class="row"><span class="k">Meeldetuletus</span><span style="font-weight:500">veebruar 2027</span></div><div class="row"><span class="k">Anname märku ka siis, kui</span><span style="font-weight:500;text-align:right">operaatorid tõstavad hindu</span></div><div class="row"><span class="k">Järgmine ühishange</span><span style="font-weight:500">sügis 2027</span></div></div>' +
    '<p class="lead" style="font-size:14px">Kui leping lõpeb või hind tõuseb, saad sama pakkumise võtta. Leping on eeltäidetud, allkirjastad ise.</p>' +
    '<div class="stack8" style="padding-top:4px"><a class="btn2" href="#m2">Tagasi pakkumise juurde</a><a class="btn3" href="#t1">Tuleva vaade: osalejad →</a></div>'
  );
};
function valjad() {
  function f(id, label, mode, ac, abi) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" data-bind="' + id + '" value="' + esc(S[id]) + '" inputmode="' + (mode || 'text') + '" autocomplete="' + (ac || 'off') + '"' + (abi ? ' aria-describedby="' + id + '-abi"' : '') + '>' + (abi ? '<span id="' + id + '-abi" class="xs">' + abi + '</span>' : '') + '</div>';
  }
  if (S.tyyp === 'firma') return f('firma', 'Ettevõtte nimi', 'text', 'organization') + f('regkood', 'Registrikood', 'numeric') + f('esindaja', 'Esindaja nimi', 'text', 'name') +
    f('esIsikukood', 'Esindaja isikukood', 'numeric', 'off', 'Allkirjastaja. Kontrollime äriregistrist, kas tal on esindusõigus.') + f('tel', 'Telefoninumber, mille üle viid', 'tel', 'tel') +
    '<fieldset class="seg"><legend>Esindusõiguse alus</legend>' + raadio('alus', 'juhatus', 'Juhatuse liige') + raadio('alus', 'volikiri', 'Volikiri') + '</fieldset>' +
    (S.alus === 'volikiri' ? '<span class="xs">Volikirja lisad lepinguga koos.</span>' : '');
  return f('nimi', 'Kliendi nimi', 'text', 'name') + f('isikukood', 'Isikukood', 'numeric') + f('tel', 'Telefoninumber, mille üle viid', 'tel', 'tel');
}
function raadio(nimi, v, label) {
  return '<label><input type="radio" name="' + nimi + '" value="' + v + '" data-radio="' + nimi + '"' + (S[nimi] === v ? ' checked' : '') + '>' + label + '</label>';
}
function kokkuNumbreid() { return 1 + S.lisad.length; }
R.m3 = function () {
  var n = kokkuNumbreid();
  return tel(
    '<a class="back" href="#m2">← Tagasi pakkumise juurde</a>' +
    '<div class="stack">' + '<span class="eyebrow">Samm 1/3 · Andmed</span><h1 class="h1" tabindex="-1">Kelle nimele leping tuleb?</h1><p class="lead" style="font-size:14px">Küsime ainult seda, mis on lepinguks vaja. E-posti võtame registreerumisest.</p></div>' +
    '<fieldset class="seg"><legend class="sr-only">Kliendi tüüp</legend>' + raadio('tyyp', 'era', 'Eraklient') + raadio('tyyp', 'firma', 'Ettevõte') + '</fieldset>' +
    valjad() +
    '<section class="stack8" aria-labelledby="lisad-h" style="border-top:1px solid var(--line);padding-top:12px"><div class="stack" style="gap:2px"><h2 id="lisad-h" style="font-size:15px;font-weight:700;color:var(--navy)">Lisanumbrid</h2><span class="small">Näiteks lapse või pereliikme number. Sama hind iga numbri kohta, arve tuleb sulle.</span></div>' +
    S.lisad.map(function (t, i) {
      return '<div class="lisa"><div class="field"><label for="lisa' + i + '" style="font-size:13px">Telefoninumber</label><input id="lisa' + i + '" inputmode="tel" data-lisa="' + i + '" value="' + esc(t) + '"></div><button type="button" class="back" data-act="eemalda" data-i="' + i + '" aria-label="Eemalda lisanumber ' + (i + 1) + '">Eemalda</button></div>';
    }).join('') +
    '<button type="button" class="btn2" data-act="lisa">+ Lisa number</button>' +
    '<div class="row"><span class="k">Kokku ' + n + (n > 1 ? ' numbrit' : ' number') + '</span><strong>' + eur(n * hind()) + ' kuus</strong></div></section>' +

var stage = document.getElementById('stage'), hupe = document.getElementById('hupe');
EKRAANID.forEach(function (e) { var o = document.createElement('option'); o.value = e[0]; o.textContent = e[1] + (KONE.indexOf(e[0]) >= 0 ? ' ●' : ''); hupe.appendChild(o); });
function praegune() { var id = location.hash.slice(1); return R[id] ? id : 'main'; }
function joonista(fookus) {
  var id = praegune();
  stage.innerHTML = R[id]();
  hupe.value = id;
  document.title = EKRAANID.filter(function (e) { return e[0] === id; })[0][1] + ' · Tuleva Kogum';
  if (fookus) { var h = stage.querySelector('h1'); if (h) h.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}
function samm(d) {
  var id = praegune(), jada = KONE.indexOf(id) >= 0 ? KONE : EKRAANID.map(function (e) { return e[0]; });
  var i = jada.indexOf(id) + d;
  if (i >= 0 && i < jada.length) location.hash = jada[i];
}
function teata(t) { var el = document.getElementById('teade'); el.textContent = ''; setTimeout(function () { el.textContent = t; }, 30); }
window.addEventListener('hashchange', function () { joonista(true); });
hupe.addEventListener('change', function () { location.hash = hupe.value; });
document.getElementById('eel').addEventListener('click', function () { samm(-1); });
document.getElementById('jar').addEventListener('click', function () { samm(1); });
document.getElementById('algus').addEventListener('click', function () { S = algseis(); if (location.hash === '#main') joonista(true); else location.hash = 'main'; });
document.addEventListener('keydown', function (e) {
  var t = e.target, kirjutab = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
  if (kirjutab || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); samm(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); samm(-1); }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('peidetud');
});
stage.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.bind) S[t.dataset.bind] = t.value;
  if (t.dataset.lisa !== undefined) S.lisad[+t.dataset.lisa] = t.value;
  if (t.dataset.slider === 'siht') {
    S.siht = parseFloat(t.value); var a = t2Arvud();
    document.getElementById('t2-siht').textContent = eur(S.siht); document.getElementById('t2-siht-tab').textContent = eur(S.siht);
    var r = document.getElementById('t2-tulemus'); r.textContent = a.tulemus; r.style.color = a.ok ? 'var(--green)' : 'var(--red)';
    document.getElementById('t2-saast').textContent = a.saast + ' € aastas'; document.getElementById('t2-kokku').textContent = '≈ ' + a.kokku + ' € aastas';
  }
});
stage.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.radio) { S[t.dataset.radio] = t.value; joonista(false); var el = stage.querySelector('input[name="' + t.dataset.radio + '"]:checked'); if (el) el.focus(); }
  if (t.dataset.bind === 'uOp') S.uOp = t.value;
  if (t.dataset.act === 'nous') { S.nous = t.checked; joonista(false); stage.querySelector('[data-act="nous"]').focus(); }
});
stage.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
  var a = b.dataset.act;
  if (a === 'lisa') { S.lisad.push(''); joonista(false); var inp = document.getElementById('lisa' + (S.lisad.length - 1)); if (inp) inp.focus(); teata('Lisanumbri väli lisatud.'); }
  else if (a === 'eemalda') { S.lisad.splice(+b.dataset.i, 1); joonista(false); stage.querySelector('[data-act="lisa"]').focus(); teata('Lisanumber eemaldatud.'); }
  else if (a === 'allkiri') { S.allkiri = true; joonista(false); document.getElementById('m3c-h').focus(); teata('Leping on allkirjastatud. Viimane samm: saada leping operaatorile.'); }
  else if (a === 'paring') { document.getElementById('t2-paring').textContent = 'Päring saadetud (näidis): Operaator A, B ja C.'; }
});
stage.addEventListener('submit', function (e) {
  if (e.target.dataset.form !== 'pakk') return;
  e.preventDefault();
  var v = parseFloat(String(document.getElementById('uhind').value).replace(',', '.'));
  if (isNaN(v) || v <= 0) { S.viga = true; S.teade = 'Sisesta hind numbrina, nt 6,90'; joonista(false); document.getElementById('uhind').focus(); return; }
  S.pakk[S.uOp] = Math.round(v * 100) / 100; S.viga = false; S.teade = 'Pakkumine salvestatud: ' + S.uOp + ' ' + eur(S.pakk[S.uOp]) + '. Võitja: ' + voitja() + '.';
  joonista(false); document.getElementById('uhind').focus();
});
joonista(false);
</script>
</body>
</html>
